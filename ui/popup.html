<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签整理助手</title>
  <style>
    /* 与主面板同一套令牌。破坏性动作在此不出现，但 danger 仍随主题保留。
       ⚠️ 这份是 options.css :root 的手工副本，两边必须同步改。
          品牌绿拆成三个角色，因为同一个色值没法同时满足三种对比度门槛：
            accent      品牌本体。主按钮底色 + 选区。⛔ 禁用于细线与小字。
            accent-line 线性元素（focus 环、描边、进度），门槛 ≥3.0。
            accent-ink  墨色（文字、徽章、描边），门槛 ≥4.5。
          主按钮压的是近黑字而不是白字：#0d1a14 压 accent 是 7.17:1，
          白字压 accent 只有 2.49:1。主面板 2026-10-07 就是这么改的。
       ⚠️⚠️ 这份副本靠 tools/ui_contract_gate.py 的「令牌同步」断言盯着：
          那个断言比对 options.css 与 popup.html 的取色，别绕过它。
       校验脚本：tools/contrast_gate.py */
    :root {
      color-scheme: light dark;
      --bg: #f4f5f4;
      --surface: #ffffff;
      --sunken: #eceeed;
      --border: #dfe1e0;
      --text: #1c1f1d;
      --muted: #5b625e;
      --accent: #26ba82;
      --accent-line: #1e9568;
      --accent-ink: #17704e;
      --on-accent: #0d1a14;
      --accent-soft: #e0f2ea;
      --danger: #a32d24;
      --danger-soft: #fbeeec;
      --radius: 14px;
      --radius-sm: 10px;
      --t-fast: 140ms;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121413;
        --surface: #1a1c1b;
        --sunken: #222423;
        --border: #2c2e2d;
        --text: #e9ebe9;
        --muted: #a0a4a1;
        --accent: #2f9d6c;
        --accent-line: #56c99e;
        --accent-ink: #26ba82;
        --on-accent: #0d1a14;
        --accent-soft: #1a2b23;
        --danger: #f2907f;
        --danger-soft: #3a201d;
      }
    }
    body {
      width: 260px; margin: 0; padding: 14px;
      font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .head img { width: 22px; height: 22px; flex: none; }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
    .stat {
      display: flex; align-items: baseline; gap: 6px;
      padding: 9px 11px; border-radius: var(--radius);
      background: var(--sunken); border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .stat b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    button {
      width: 100%; padding: 8px; font: inherit; cursor: pointer;
      /* 与主面板同一条规则：品牌色底 + 近黑字（7.17:1），
         而不是「深绿底 + 白字」。后者正是主面板这次换掉的那个写法。 */
      border: 1px solid var(--accent); background: var(--accent);
      color: var(--on-accent);
      border-radius: var(--radius-sm); font-weight: 600;
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    /* ⚠️ hover 刻意用 brightness 而不是换成 --accent：
       白字压在 --accent（#26ba82）上只有 2.49:1，hover 时文字对比度会塌掉。
       提亮同一个 --accent-ink 底色既保留反馈，对比度还比静止态更高。 */
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:active { transform: none; }
    }
    .note { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="head">
    <img src="logo.webp" alt="">
    <h1>书签整理助手</h1>
  </div>
  <p class="sub">预览确认后再写入</p>
  <div class="stat"><b id="pending">—</b><span>条书签待分类</span></div>
  <button id="open">打开整理面板</button>
  <p class="note">重排书签树是破坏性操作，扩展不会自动执行。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
