<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签整理助手</title>
  <style>
    /* 与主面板同一套淡绿令牌。破坏性动作在此不出现，但 danger 仍随主题保留。 */
    :root {
      color-scheme: light dark;
      --bg: #f1f5ee;
      --surface: #ffffff;
      --sunken: #e9f0e5;
      --border: #dce5d7;
      --text: #1e2a22;
      --muted: #6c7b70;
      --accent: #2f9e5e;
      --accent-soft: #e2f1e6;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121813;
        --surface: #1a211c;
        --sunken: #222a24;
        --border: #2c362e;
        --text: #e7ede8;
        --muted: #96a39a;
        --accent: #5cc98d;
        --accent-soft: #1c2e23;
      }
    }
    body {
      width: 260px; margin: 0; padding: 14px;
      font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .head img { width: 22px; height: 22px; flex: none; }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
    .stat {
      display: flex; align-items: baseline; gap: 6px;
      padding: 9px 11px; border-radius: var(--radius);
      background: var(--sunken); border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .stat b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    button {
      width: 100%; padding: 8px; font: inherit; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      border-radius: 10px; font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="head">
    <img src="logo.webp" alt="">
    <h1>书签整理助手</h1>
  </div>
  <p class="sub">预览确认后再写入</p>
  <div class="stat"><b id="pending">—</b><span>条书签待分类</span></div>
  <button id="open">打开整理面板</button>
  <p class="note">重排书签树是破坏性操作，扩展不会自动执行。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
