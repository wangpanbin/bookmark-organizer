<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签整理助手</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 260px; margin: 0; padding: 14px;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #fff; color: #1c2024;
    }
    @media (prefers-color-scheme: dark) { body { background: #1c2024; color: #e6e9ec; } }
    h1 { margin: 0 0 2px; font-size: 14px; }
    .sub { margin: 0 0 12px; font-size: 12px; opacity: .7; }
    .stat {
      display: flex; align-items: baseline; gap: 6px;
      padding: 9px 11px; border: 1px solid rgba(128,128,128,.3);
      border-radius: 7px; margin-bottom: 10px;
    }
    .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; opacity: .75; }
    .stat.warn b { color: #b7791f; }
    button {
      width: 100%; padding: 8px; font: inherit; cursor: pointer;
      border: 1px solid #2f6feb; background: #2f6feb; color: #fff; border-radius: 6px;
    }
    button:hover { filter: brightness(1.08); }
    .note { margin: 10px 0 0; font-size: 11.5px; opacity: .6; }
  </style>
</head>
<body>
  <h1>书签整理助手</h1>
  <p class="sub">预览确认后再写入</p>
  <div class="stat"><b id="pending">—</b><span>条书签待分类</span></div>
  <button id="open">打开整理面板</button>
  <p class="note">重排书签树是破坏性操作，扩展不会自动执行。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
