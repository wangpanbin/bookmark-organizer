<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签整理助手</title>
  <style>
    /* 与主面板同一套淡绿令牌。破坏性动作在此不出现，但 danger 仍随主题保留。
       ⚠️ 这份是 options.css :root 的手工副本，两边必须同步改：
          accent（填充）拆成 accent + accent-ink（墨色），因为白字压在
          accent 上只有 3.40:1，压在 accent-ink 上才是 6.51:1。
       校验脚本：tools/contrast_gate.py */
    :root {
      color-scheme: light dark;
      --bg: #f1f5ee;
      --surface: #ffffff;
      --sunken: #e9f0e5;
      --border: #dce5d7;
      --text: #1e2a22;
      --muted: #5c6a60;
      --accent: #2f9e5e;
      --accent-ink: #1c6b40;
      --on-accent: #ffffff;
      --accent-soft: #e2f1e6;
      --danger: #a32d24;
      --danger-soft: #fbeeec;
      --radius: 14px;
      --radius-sm: 10px;
      --t-fast: 140ms;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121813;
        --surface: #1a211c;
        --sunken: #222a24;
        --border: #2c362e;
        --text: #e7ede8;
        --muted: #9aac9f;
        --accent: #4fbf88;
        --accent-ink: #7fd6a8;
        --on-accent: #0f1712;
        --accent-soft: #1c2e23;
        --danger: #f2907f;
        --danger-soft: #3a201d;
      }
    }
    body {
      width: 260px; margin: 0; padding: 14px;
      font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .head img { width: 22px; height: 22px; flex: none; }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
    .stat {
      display: flex; align-items: baseline; gap: 6px;
      padding: 9px 11px; border-radius: var(--radius);
      background: var(--sunken); border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .stat b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    button {
      width: 100%; padding: 8px; font: inherit; cursor: pointer;
      border: 1px solid var(--accent-ink); background: var(--accent-ink);
      color: var(--on-accent);
      border-radius: var(--radius-sm); font-weight: 600;
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    button:hover { background: var(--accent); border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:active { transform: none; }
    }
    .note { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="head">
    <img src="logo.webp" alt="">
    <h1>书签整理助手</h1>
  </div>
  <p class="sub">预览确认后再写入</p>
  <div class="stat"><b id="pending">—</b><span>条书签待分类</span></div>
  <button id="open">打开整理面板</button>
  <p class="note">重排书签树是破坏性操作，扩展不会自动执行。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
